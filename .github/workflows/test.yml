name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install fastapi "pydantic>=2" httpx pyyaml pytest pytest-asyncio openai python-multipart
      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout plugin dependencies
        uses: actions/checkout@v4
        with:
          repository: MatousVavra/anotherme-plugin-memory
          ref: v0.1.0
          path: deps/memory
      # stories is not a manifest dependency, but the unified-timeline tests
      # create a story through its routes.
      - uses: actions/checkout@v4
        with:
          repository: MatousVavra/anotherme-plugin-stories
          ref: v0.1.0
          path: deps/stories
      - name: Run integration tests inside the released app image
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -v "$PWD/plugin:/data/plugins/diary" \
            -v "$PWD/deps/memory/plugin:/data/plugins/memory" \
            -v "$PWD/deps/stories/plugin:/data/plugins/stories" \
            -e PYTHONPATH=/app \
            ghcr.io/matousvavra/anotherme:latest \
            sh -c "cd /repo && pip install -q pytest pytest-asyncio && pytest tests/integration -v"
