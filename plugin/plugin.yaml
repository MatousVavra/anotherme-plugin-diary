name: diary
version: 0.2.0
description: Diary entries with AI analysis, timeline, and mood tracking
author: AnotherMe
entrypoint: plugin
capabilities:
  - routes
  - ui
dependencies:
  - memory
soft_dependencies:
  - name: stt
    enables: "voice diary input (mic button)"
  - name: notes
    enables: "open diary notes from the timeline"
  - name: stories
    enables: "seed question consumption from diary entries"
ui:
  tab: Diary
  icon: diary
  order: 20
settings:
  - key: auto_extract
    label: "Auto-extract facts"
    type: toggle
    default: true
    description: "Automatically extract facts and people from diary entries"
